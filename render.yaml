services:
  # ── Backend API (Node.js Web Service) ──────────────────────────────────────
  - type: web
    name: truthcheck-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      # ⚠️  Set these in the Render Dashboard → Environment tab
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      # Set CLIENT_ORIGIN to your frontend URL (e.g. https://truthcheck-web.onrender.com)
      # Multiple origins: comma-separated (e.g. https://truthcheck-web.onrender.com,https://yourdomain.com)
      - key: CLIENT_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
    plan: free
    autoDeploy: true

  # ── Frontend Web App (React + Vite — Static Site) ──────────────────────────
  - type: web
    name: truthcheck-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # ⚠️  IMPORTANT: Set this to your backend URL + /api suffix
      # e.g. https://truthcheck-api.onrender.com/api
      # (The /api prefix is required — it matches your Express route prefix)
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback: all paths (e.g. deep links) return index.html
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free
    autoDeploy: true
